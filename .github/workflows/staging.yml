name: Staging

# Staging (docs/staging.md): every push to the `eras` branch is checked, then deployed to the
# pitwall-staging Worker and its own D1 (pitwall-staging-db), where ERAS_TEST_MODE is on.
# Production (ci.yml, from main) is untouched by this workflow.
on:
  push:
    branches: [eras]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  js:
    name: JS/TS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  deploy-staging:
    name: Deploy staging Worker + D1 migrations
    needs: [js]
    if: github.ref == 'refs/heads/eras'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply staging D1 migrations
        run: pnpm --filter @laststint/worker migrate:staging
      - name: Deploy staging worker
        run: pnpm --filter @laststint/worker deploy:staging
