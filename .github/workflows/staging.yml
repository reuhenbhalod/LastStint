name: Staging

# Staging (docs/staging.md): every push to the `eras` branch is checked, then deployed to the
# pitwall-staging Worker and its own D1 (pitwall-staging-db), where ERAS_TEST_MODE is on, and
# the staging website (pitwall-web-staging) is built against that API and deployed.
# Production (ci.yml, from main) is untouched by this workflow.
on:
  push:
    branches: [eras]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

# GitHub-hosted runners (free: the repo is public). The sim's wall-clock budget test gets 4 s
# on a shared runner (packages/sim/tests/grade.test.ts; 1 s on a quiet machine). To go back to
# the PC runners: runs-on: [self-hosted, linux, wsl] (docs/pc-ci-runner.md).
env:
  SIM_RUNTIME_BUDGET_MS: 4000

jobs:
  js:
    name: JS/TS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  deploy-staging:
    name: Deploy staging Worker + D1 migrations
    needs: [js]
    if: github.ref == 'refs/heads/eras'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply staging D1 migrations
        run: pnpm --filter @laststint/worker migrate:staging
      - name: Deploy staging worker
        run: pnpm --filter @laststint/worker deploy:staging

  # The staging website (apps/web, env.staging in its wrangler.jsonc): built against the staging
  # API and deployed after it, so the site never calls an API older than itself. deploy:staging
  # builds with the staging VITE_* values (apps/web/package.json build:staging) and runs
  # `wrangler deploy --env staging`.
  deploy-staging-web:
    name: Deploy staging website
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/eras'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy staging website
        run: pnpm --filter @laststint/web deploy:staging
