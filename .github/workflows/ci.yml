name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; runs on main are not, so a deploy is never cut off mid-migration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  js:
    name: JS/TS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Worker race bundle is up to date
        run: pnpm --filter @laststint/worker races && git diff --exit-code apps/worker/src/races.gen.ts
      - name: Test
        run: pnpm test

  # Eras spec §15: every Eras race has a path to all three stars and the hidden objective (era
  # difficulty and Legend), and staying out every time can't earn ★3. It plays ~100 races and
  # takes ~100 minutes, so it runs only when a change can move a race's outcome: race data
  # (data/), the sim or schema, or the Eras worker code. Other changes (web UI, docs, CI)
  # pass this job in about a minute, and so does a push to main that merges exactly what its
  # PR already tested (.github/scripts/eras-checks-needed.sh). Run it by hand with workflow_dispatch.
  eras-reachability:
    name: Eras reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Do the Eras checks need to run?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: echo "run=$(.github/scripts/eras-checks-needed.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Eras reachability
        if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @laststint/sim reachability
      # The shared races' eras blocks live in their overlays (their Daily files are pinned):
      # check them on the merged model the Eras API serves.
      - name: Eras reachability (shared races)
        if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @laststint/worker reachability:shared

  # Parity (Gate G2): the committed race models and golden files must be exactly what the
  # Python pipeline produces from the committed snapshots, and the TS sim must reproduce them.
  parity:
    name: TS<->Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --dev
        working-directory: pipeline
      - name: Rebuild race models + golden files from snapshots
        run: uv run pipeline build --all
        working-directory: pipeline
      # Two kinds of race file are exempt from the rebuild comparison:
      # - Daily/Gauntlet pool races are frozen (CLAUDE.md rule 3): the Eras pipeline rebuilds
      #   ~25 of them 0.001 off in the last digit, and their committed files must not change.
      # - Four Eras-built races whose Linux build differs from the Mac build by float rounding
      #   (0.0003-0.02 in a few fitted values, which shifts their goldens). The game serves the
      #   committed files; the TS sim test below still checks them against their goldens.
      - name: Committed data is up to date
        run: |
          python3 - <<'PY' > /tmp/parity-exempt
          import json, os
          pools = json.load(open("data/pools.json"))
          ids = set(pools["daily"]) | set(pools["survivor"])
          ids |= {"emilia-romagna-2024", "great-britain-2023", "monaco-2023", "monaco-2025"}
          for rid in sorted(ids):
              for d in ("races", "golden"):
                  path = f"data/{d}/{rid}.json"
                  if os.path.exists(path):
                      print(path)
          PY
          xargs git checkout -- < /tmp/parity-exempt
          git diff --exit-code -- data/
      - run: pnpm install --frozen-lockfile
      - name: TS sim matches golden files
        run: pnpm --filter @laststint/sim test

  # Browser playthroughs (frontend spec C4): Daily, Gauntlet, admin and the rest every time. The
  # Eras specs (eras-*.spec.ts, ~40 minutes) run only when a change can affect Eras: race data,
  # the sim or schema, the Eras web code or the Eras specs, and not again on main for code its
  # PR already tested (.github/scripts/eras-checks-needed.sh). The API is mocked, so no Worker.
  e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Do the Eras specs need to run?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(.github/scripts/eras-checks-needed.sh)" = false ]; then echo "E2E_SKIP_ERAS=1" >> "$GITHUB_ENV"; fi
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @laststint/web exec playwright install --with-deps chromium
      - name: Playthrough
        run: pnpm --filter @laststint/web e2e

  # Deploy runs only on main and only once every check above has passed.
  deploy:
    name: Deploy Worker + D1 migrations
    needs: [python, js, eras-reachability, parity, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @laststint/worker migrate:remote
      - name: Deploy worker
        run: pnpm --filter @laststint/worker run deploy

  # The website (apps/web): built against the live API and deployed as a static-assets Worker,
  # after the API so the site never calls an API older than itself.
  deploy-web:
    name: Deploy website
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE: https://pitwall.boxboxbox.workers.dev
      VITE_GOOGLE_CLIENT_ID: 318278030629-s860fnjjpk6ihcn4iubjqiakf8vu0pqi.apps.googleusercontent.com
      VITE_AUTH0_DOMAIN: dev-umxcdh2y62l4e0gy.us.auth0.com
      VITE_AUTH0_CLIENT_ID: Pdlxz3iAqJse61VUhOGpF8wSeFgV7yxM
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @laststint/web build
      - name: Deploy
        run: pnpm --filter @laststint/web run deploy
