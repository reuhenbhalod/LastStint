name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  js:
    name: JS/TS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Worker race bundle is up to date
        run: pnpm --filter @boxthislap/worker races && git diff --exit-code apps/worker/src/races.gen.ts
      - name: Test
        run: pnpm test

  # Parity (Gate G2): the committed race models and golden files must be exactly what the
  # Python pipeline produces from the committed snapshots, and the TS sim must reproduce them.
  parity:
    name: TS<->Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --dev
        working-directory: pipeline
      - name: Rebuild race models + golden files from snapshots
        run: uv run pipeline build --all
        working-directory: pipeline
      - name: Committed data is up to date
        run: git diff --exit-code -- data/
      - run: pnpm install --frozen-lockfile
      - name: TS sim matches golden files
        run: pnpm --filter @boxthislap/sim test
