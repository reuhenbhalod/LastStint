name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; runs on main are not, so a deploy is never cut off mid-migration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  js:
    name: JS/TS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Worker race bundle is up to date
        run: pnpm --filter @boxthislap/worker races && git diff --exit-code apps/worker/src/races.gen.ts
      - name: Test
        run: pnpm test

  # Parity (Gate G2): the committed race models and golden files must be exactly what the
  # Python pipeline produces from the committed snapshots, and the TS sim must reproduce them.
  parity:
    name: TS<->Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --dev
        working-directory: pipeline
      - name: Rebuild race models + golden files from snapshots
        run: uv run pipeline build --all
        working-directory: pipeline
      - name: Committed data is up to date
        run: git diff --exit-code -- data/
      - run: pnpm install --frozen-lockfile
      - name: TS sim matches golden files
        run: pnpm --filter @boxthislap/sim test

  # Deploy runs only on main and only once every check above has passed.
  deploy:
    name: Deploy Worker + D1 migrations
    needs: [python, js, parity]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @boxthislap/worker migrate:remote
      - name: Deploy worker
        run: pnpm --filter @boxthislap/worker run deploy
