name: Re-grade runs

# Beta spec B6: on Cloudflare's free plan the Worker scores runs from the grades the game
# claims. Every night this re-grades each new run with full playouts and corrects any run whose
# claimed grades were edited (apps/worker/scripts/reverify.ts).
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

concurrency:
  group: reverify
  cancel-in-progress: false

jobs:
  reverify:
    name: Re-grade unverified runs
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from package.json "packageManager"
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-grade
        run: pnpm --filter @laststint/worker reverify --remote
