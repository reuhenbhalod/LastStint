[project]
name = "pipeline"
version = "0.0.0"
description = "F1 timing data -> race-model JSON pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
